# Netlify config (vercel.json covers Vercel).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"   # Vite 8 needs Node 20.19+ or 22.12+

# Single-page app: every route (/admin ...) serves index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
